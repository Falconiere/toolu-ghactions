name: 'Toolu Cloudflare Tunnel — Start'
description: |
  Boots a Cloudflare Tunnel directly on the runner host (Linux + macOS),
  exposing a local HOST:PORT to the public internet. Quick tunnels (no account,
  ephemeral *.trycloudflare.com URL) by default; set `tunnel-token` to use a
  named tunnel. Because cloudflared runs on the host (not in a container),
  HOST:PORT resolves to your app and the tunnel survives across steps. Pair with
  the matching `stop` step (use `if: always()`) to clean up.
author: 'Falconiere'
branding:
  icon: 'cloud'
  color: 'orange'

inputs:
  name:
    description: 'Tunnel instance name. Namespaces PID/URL tmpfiles so multiple tunnels can run in the same job.'
    required: false
    default: 'default'
  host:
    description: 'Local host to expose (quick mode only — ignored when `tunnel-token` is set). Resolves on the runner host.'
    required: false
    default: 'localhost'
  port:
    description: 'Local port to expose (quick mode only — ignored when `tunnel-token` is set).'
    required: false
    default: '3000'
  tunnel-token:
    description: 'Cloudflare Tunnel token (from the dashboard or `cloudflared tunnel token`). When set, switches to named-tunnel mode.'
    required: false
    default: ''
  tunnel-config:
    description: 'Path to a cloudflared config.yml with custom ingress rules (named mode only). Copied to /etc/cloudflared/config.yml.'
    required: false
    default: ''
  cloudflared-version:
    description: 'cloudflared release tag to download (see cloudflare/cloudflared releases).'
    required: false
    default: '2024.12.2'
  verify-checksum:
    description: 'Verify cloudflared binary SHA256 against the release checksums.txt before installing. Defaults to false because the checksums.txt format is brittle (variable whitespace, optional BSD `*` prefix); opt in when you control the parser or have a pinned version known to parse cleanly.'
    required: false
    default: 'false'
  protocol:
    description: 'cloudflared transport protocol (`quic`, `http2`, or `auto`). Leave empty for cloudflared''s default (QUIC). Set to `http2` on networks that block outbound UDP 7844 — otherwise cloudflared retries QUIC for ~5min before falling back, stalling registration past start-timeout.'
    required: false
    default: ''
  start-timeout:
    description: 'Seconds to wait for the tunnel URL/ID to appear, then (separately) for the edge connection to register, before failing. Worst case is roughly twice this value.'
    required: false
    default: '30'

outputs:
  tunnel-url:
    description: 'Public URL of the tunnel (quick mode only; empty in named mode unless ingress exposes a hostname).'
    value: ${{ steps.tunnel.outputs.tunnel-url }}
  tunnel-id:
    description: 'Tunnel ID (named mode only). Extracted by parsing the UUID from cloudflared stderr line matching `Registered tunnel connection.*<uuid>`.'
    value: ${{ steps.tunnel.outputs.tunnel-id }}
  tunnel-pid:
    description: 'PID of the cloudflared process. Diagnostic only — stop reads its own tmpfile keyed by name, not this output.'
    value: ${{ steps.tunnel.outputs.tunnel-pid }}
  tunnel-name:
    description: 'Echo of the name input (slugified), for downstream step convenience.'
    value: ${{ steps.tunnel.outputs.tunnel-name }}

runs:
  using: composite
  steps:
    - id: tunnel
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_TUNNEL_TOKEN: ${{ inputs.tunnel-token }}
        INPUT_TUNNEL_CONFIG: ${{ inputs.tunnel-config }}
        INPUT_CLOUDFLARED_VERSION: ${{ inputs.cloudflared-version }}
        INPUT_VERIFY_CHECKSUM: ${{ inputs.verify-checksum }}
        INPUT_START_TIMEOUT: ${{ inputs.start-timeout }}
        INPUT_PROTOCOL: ${{ inputs.protocol }}
      run: bash "$GITHUB_ACTION_PATH/../src/start.sh"
