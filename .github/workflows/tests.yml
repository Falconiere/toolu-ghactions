name: tests

on:
  push:
  pull_request:

jobs:
  code-review:
    name: code-review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-review
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (oxlint + type-aware, zero warnings)
        run: bun run lint
      - name: Format check (oxfmt)
        run: bun run fmt:check
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build dist
        run: bun run build
      - name: dist is in sync with src
        # The committed dist/index.cjs must match a fresh build — consumers run the
        # checked-in bundle, not the TS sources. Fail if `bun run build` produced
        # any change.
        run: git diff --quiet -- dist
      - name: action.yml is a node24 JS action
        # Dependency-free assertion (no @action-validator — it rejects node24).
        run: |
          grep -qF "using: 'node24'" action.yml
          grep -qF "main: 'dist/index.cjs'" action.yml
          ! grep -qF '6 AI vendors' action.yml

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: bats
        run: bats scripts/__tests__/*.bats
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  tunnel-test:
    name: tunnel bats (${{ matrix.os }})
    # cloudflare-tunnel is a composite action that runs on the runner host, so
    # the scripts must work on both Linux and macOS runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install bats + jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install bats + jq (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq
      - name: Run tunnel test suite
        run: bats cloudflare-tunnel/__tests__/*.bats

  tunnel-lint:
    name: tunnel shellcheck + action-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck --severity=warning cloudflare-tunnel/src/*.sh
      - name: action-validator (start)
        run: npx --yes @action-validator/cli cloudflare-tunnel/start/action.yml
      - name: action-validator (stop)
        run: npx --yes @action-validator/cli cloudflare-tunnel/stop/action.yml
      - name: action-validator (wait)
        run: npx --yes @action-validator/cli cloudflare-tunnel/wait/action.yml
