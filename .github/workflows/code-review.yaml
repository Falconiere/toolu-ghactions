name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  security-events: write

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dogfooding runs the LOCAL action (the PR's own code-review/), so restrict it
    # to same-repo PRs — a fork PR must not execute its untrusted build on our
    # runner. Forks are withheld the secret anyway; this also skips them cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Dogfood the LOCAL action (this checkout), not the published @v2 — so the
      # in-repo build reviews this repo's own PRs before it ships in a release.
      - uses: ./code-review
        with:
          # Flat provider contract. PROVIDER is written out rather than left to
          # action.yml's default: this step runs the LOCAL action, so editing that
          # default would silently move this repo's own review along with it.
          # MODEL_ID still rides the action's default (deepseek/deepseek-v4-pro)
          # and carries the same exposure.
          PROVIDER: openrouter
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Dogfood Jev on this repo's own reviews. It reuses API_KEY (no extra
          # secret) and shares the review deadline; JEV_MODEL_ID is pinned to the
          # same value action.yml defaults to, for the reason PROVIDER is pinned
          # above — a default change must not silently move this repo's reviews.
          JEV_ENABLED: 'true'
          JEV_MODEL_ID: typesafe/jev-1.13

  # The `merge-gate` required check, evaluated after the reviewer has posted its
  # threads and set its label, so a push is never judged against the previous
  # commit's findings. merge-gate.yml re-evaluates the same check when a thread
  # gets a reply or a label changes by hand. `!cancelled()`, not `always()`: a
  # red or skipped `review` (a fork PR) must still yield a verdict here, but a
  # run superseded by a newer push must not. Dogfoods the LOCAL action, like
  # `review`; it needs no secret, so fork PRs run it too.
  merge-gate:
    needs: review
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: merge-gate
      - uses: ./merge-gate
