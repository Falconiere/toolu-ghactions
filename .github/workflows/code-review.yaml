name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  security-events: write

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dogfooding runs the LOCAL action (the PR's own code-review/), so restrict it
    # to same-repo PRs — a fork PR must not execute its untrusted build on our
    # runner. Forks are withheld the secret anyway; this also skips them cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Dogfood the LOCAL action (this checkout), not the published @v2 — so the
      # in-repo build reviews this repo's own PRs before it ships in a release.
      - uses: ./code-review
        with:
          # v4 flat contract. PROVIDER is written out rather than left to
          # action.yml's default: this step runs the LOCAL action, so editing that
          # default would silently move this repo's own review along with it.
          # MODEL_ID still rides the per-provider default (openrouter ->
          # deepseek/deepseek-v4-pro) and carries the same exposure.
          PROVIDER: openrouter
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
