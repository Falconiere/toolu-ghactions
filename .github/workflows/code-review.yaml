name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Dogfooding runs the LOCAL action (the PR's own code-review/), so restrict it
    # to same-repo PRs — a fork PR must not execute its untrusted build on our
    # runner. Forks are withheld the secret anyway; this also skips them cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Dogfood the LOCAL action (this checkout), not the published @v2 — so the
      # in-repo build reviews this repo's own PRs before it ships in a release.
      - uses: ./code-review
        with:
          # v4 flat contract: PROVIDER defaults to openrouter, MODEL_ID to
          # deepseek/deepseek-v4-pro; API_KEY is the OpenRouter key.
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
