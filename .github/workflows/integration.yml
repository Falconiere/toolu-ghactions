name: cloudflare-tunnel integration

# Real-world E2E for the cloudflare-tunnel composite action. Boots a real
# cloudflared quick tunnel pointing at a local HTTP server on the runner host,
# then probes the public URL to prove the tunnel reaches HOST:PORT. Runs on
# Linux and macOS (the action must work on both). Triggered when the action
# changes — no weekly cron: an ephemeral per-run tunnel has nothing to smoke-test
# on a schedule.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare-tunnel/**'
      - 'code-review/**'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-tunnel/**'
      - 'code-review/**'
      - '.github/workflows/integration.yml'

jobs:
  quick:
    name: quick tunnel E2E (${{ matrix.os }})
    # Real-tunnel E2E runs on ubuntu only. macOS-hosted runners can't reliably
    # reach the trycloudflare edge (the public quick-tunnel URL times out on
    # connect), so the real-tunnel smoke is Linux-only. macOS support for the
    # action's scripts is covered by the `tunnel bats (macos-latest)` job in
    # tests.yml (real darwin install, start parse, detached spawn, stop).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Start backing HTTP server on 127.0.0.1:8000
        run: |
          echo "hello from ${RUNNER_OS}" > index.html
          nohup python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2

      - name: Start tunnel
        id: start
        uses: ./cloudflare-tunnel/start
        with:
          host: 127.0.0.1
          port: 8000
          # Hosted runners can block/throttle outbound UDP 7844 (QUIC); force
          # http2 (TCP 443) so the tunnel registers promptly instead of cloudflared
          # burning ~5min retrying QUIC before it falls back on its own.
          protocol: http2

      - name: Wait for tunnel
        uses: ./cloudflare-tunnel/wait
        with:
          url: ${{ steps.start.outputs.tunnel-url }}
          wait-timeout: 120

      - name: Probe tunnel URL (proves tunnel -> 127.0.0.1:8000)
        run: |
          body=$(curl -fsS --max-time 10 "${{ steps.start.outputs.tunnel-url }}")
          echo "$body"
          echo "$body" | grep -q "hello from ${RUNNER_OS}"

      - name: Dump cloudflared log
        if: failure()
        run: cat /tmp/cf-tunnel-*.log || true

      - name: Stop tunnel
        if: always()
        uses: ./cloudflare-tunnel/stop

  code-review-injection:
    # Opt-in adversarial probe for the @mention steering feature: a malicious
    # `@toolu review …` instruction must NOT flip the verdict or break the JSON
    # schema (the structural defense is unit-tested in code-review/src/**; this is
    # the live-model check). Requires a real provider key; skips cleanly without
    # one. NON-REQUIRED — never gate `main` on this job.
    name: code-review injection probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        working-directory: code-review
        run: bun install --frozen-lockfile
      - name: Probe prompt-injection containment via the TS modules
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/injection-probe.mjs

  hybrid-sast-smoke:
    # E2E for the hybrid deterministic layer: plant a secret + an eval pattern, then run
    # the SAME pinned gitleaks + opengrep binaries the composite action installs, and assert
    # they produce SARIF findings. Also validates the pinned release-download URLs in
    # code-review/action.yml. NON-REQUIRED — never gate `main` on this job.
    name: hybrid SAST smoke (gitleaks + opengrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Plant a secret + an eval pattern
        # Build the test PAT at runtime: the `ghp_` prefix and the body are SEPARATE
        # literals here, so the committed workflow never contains a contiguous
        # github-pat token (which GitHub push protection blocks) — yet the file written
        # on the runner does, so gitleaks detects it.
        run: |
          mkdir -p planted
          PFX=ghp_
          printf 'export const t = "%s%s";\nexport const r = (i) => eval(i);\n' \
            "$PFX" "wWPw5k4aXcaT4fNP0UcnZwJUVFk6LO0pINUx" > planted/leak.ts
      - name: gitleaks (pinned) finds the planted secret
        run: |
          GL=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source planted --no-git --report-format sarif --report-path gitleaks.sarif --exit-code 0 || true
          test "$(jq '.runs[0].results | length' gitleaks.sarif)" -ge 1
      - name: opengrep (pinned) runs and emits SARIF
        run: |
          OG=v1.22.0
          curl -fsSL -o opengrep "https://github.com/opengrep/opengrep/releases/download/${OG}/opengrep_manylinux_x86" && chmod +x opengrep
          ./opengrep scan --sarif --output opengrep.sarif --config p/typescript planted || true
          test -f opengrep.sarif
