# OQ-2 ship gate for the nested node24 actions (docs/toolu/specs/
# 2026-08-10-code-review-reliability-design.md): proves the composite's
# `$/code-review/run` + `$/code-review/sanitize-sarif` references resolve when
# the action is consumed REMOTELY (owner/repo/path@ref → actions cache), the
# shape every real consumer uses. Success = both nested steps START (resolution);
# the review step is expected to no-op/skip on workflow_dispatch — that part is
# runtime, not resolution, and is not what this gate measures.
#
# The consumed ref is HARDCODED in the `uses:` line below (`uses:` cannot take
# expressions) — edit it per release branch before dispatching, and verify the
# run's log shows the composite fetched at the ref you expect. The hoisted-mirror
# shape is covered separately: the mirror bats test asserts the $/ hoist rewrite,
# plus a one-off dispatch against the mirror repo before a Marketplace release.
#
# Runs on PRs touching the composite (dispatch is only possible once the file
# is on the default branch, so the PR trigger is what makes it a PRE-merge gate)
# and manually via: gh workflow run nested-uses-proof.yml
name: Nested uses proof (OQ-2)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'code-review/action.yml'
      - 'code-review/run/**'
      - 'code-review/sanitize-sarif/**'
      - '.github/workflows/nested-uses-proof.yml'

permissions:
  contents: read

jobs:
  consume-remote-shape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (consumer workspace — deliberately NOT this action repo layout)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Remote-style reference to our own composite: fetched into the actions
      # cache exactly like a consumer's pin, so `$/` inside it must resolve
      # against the ACTION repo, not this workspace.
      - name: Consume composite at the requested ref
        id: probe
        continue-on-error: true # runtime failures are fine; resolution failures are what we read from the log
        uses: falconiere/toolu-ghactions/code-review@feat/code-review-reliability
        with:
          PROVIDER: deepseek
          API_KEY: proof-run-no-key
          RUN_SECRET_SCAN: 'false'
          RUN_SAST: 'false'
      - name: Report
        run: |
          echo "Composite completed with outcome '${{ steps.probe.outcome }}'."
          echo "Resolution proof = the nested steps appeared in the log above;"
          echo "an unresolved \$/ reference fails the job BEFORE any step runs."
