name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: falconiere/toolu-ghactions/security/codeql@v1
        with:
          severity_threshold: 7.0

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: falconiere/toolu-ghactions/security/secret-scan@v1
        with:
          fail_on_findings: true