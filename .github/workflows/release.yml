name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A published release — created by release-please OR manually — rebuilds the
  # images directly. This decouples image publishing from release-please's
  # release-creation step, so a hiccup there (e.g. a token without repo write)
  # no longer strands the images on an old version.
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  # release-please applies `autorelease:` labels to its PR (labels go through
  # the issues API).
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # The release event path skips straight to publishing; release-please only
    # runs for pushes to main / manual dispatch.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      major: ${{ steps.rp.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PAT or GitHub App token lets the release PR trigger other
          # workflows (tests) AND must belong to an account with write access
          # to this repo. Falls back to GITHUB_TOKEN, under which the release PR
          # will NOT run CI — set RELEASE_PLEASE_TOKEN to fix that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  version:
    name: Resolve release version
    needs: [release-please]
    # Run when release-please just cut a release, or when a release was
    # published directly. always() lets this run even though release-please is
    # skipped on the release event.
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'release')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      major: ${{ steps.v.outputs.major }}
    steps:
      - id: v
        shell: bash
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Prefer the published-release tag; fall back to release-please's.
          tag="${REL_TAG:-$RP_TAG}"
          if [ -z "$tag" ]; then echo "::error::could not resolve a release tag"; exit 1; fi
          major="${tag#v}"; major="${major%%.*}"
          if [ -z "$major" ]; then echo "::error::could not parse a major version from '$tag'"; exit 1; fi
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

  publish-image:
    name: Build & push ${{ matrix.action }} image to GHCR
    needs: [version]
    # !cancelled() is required: `version` transitively depends on the
    # release-please job, which is SKIPPED on the release event. Without
    # !cancelled(), GitHub propagates that skip and skips this job too, even
    # though `version` itself succeeded. !cancelled() forces the if to evaluate;
    # the result check then gates on version actually having succeeded.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Actions publish independently — no dependency between code-review and
      # cloudflare-tunnel. Both must succeed for the release to be green.
      fail-fast: false
      matrix:
        action: [code-review, cloudflare-tunnel]
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository_owner }}/toolu-ghactions/${{ matrix.action }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=v${{ needs.version.outputs.major }}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.action }}
          file: ./${{ matrix.action }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  move-major-alias:
    name: Move v<major> alias
    needs: [version]
    # !cancelled() is required: `version` transitively depends on the
    # release-please job, which is SKIPPED on the release event. Without
    # !cancelled(), GitHub propagates that skip and skips this job too, even
    # though `version` itself succeeded. !cancelled() forces the if to evaluate;
    # the result check then gates on version actually having succeeded.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move alias
        env:
          TAG: ${{ needs.version.outputs.tag }}
          MAJOR: ${{ needs.version.outputs.major }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${MAJOR}" "${TAG}"
          git push origin "v${MAJOR}" --force || {
            echo "::error::Failed to move v${MAJOR} alias to ${TAG} — the floating major tag is now stale"
            exit 1
          }
