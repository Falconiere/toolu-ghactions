name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A published release — created by release-please OR manually — rebuilds the
  # images directly. This decouples image publishing from release-please's
  # release-creation step, so a hiccup there (e.g. a token without repo write)
  # no longer strands the images on an old version.
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  # release-please applies `autorelease:` labels to its PR (labels go through
  # the issues API).
  issues: write

concurrency:
  # One release pipeline at a time REPO-WIDE, not per ref: the push-to-main run
  # and the release-published run fire seconds apart with DIFFERENT refs
  # (refs/heads/main vs the tag) and both force-move the same v<major> alias on
  # the mirrors — per-ref groups let them race mid-push ("cannot lock ref
  # 'refs/tags/v6': is at X but expected Y"). Serialize instead; never cancel.
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # The release event path skips straight to publishing; release-please only
    # runs for pushes to main / manual dispatch.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_ID != '' }}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      major: ${{ steps.rp.outputs.major }}
    steps:
      # Prefer a GitHub App installation token: unlike a fine-grained PAT it
      # never expires (the 2026-07 release outage was a PAT hitting its 30-day
      # default expiry — "Bad credentials"). continue-on-error keeps the
      # fallback chain alive when the app is missing or not installed here.
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: env.HAS_APP == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # Surface a masked mint failure loudly — continue-on-error keeps the run
      # alive, but a broken app install must not hide behind the PAT fallback.
      - name: App token mint failed (falling back)
        if: steps.app-token.outcome == 'failure'
        run: echo "::warning::create-github-app-token failed — check the app installation/permissions on this repo; release-please falls back to the PAT/GITHUB_TOKEN."
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # An app token or PAT lets the release PR trigger other workflows
          # (tests) AND must belong to an identity with write access to this
          # repo. Falls back to GITHUB_TOKEN, under which the release PR will
          # NOT run CI.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOOLU_ACTIONS_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  version:
    name: Resolve release version
    needs: [release-please]
    # Run when release-please just cut a release, or when a release was
    # published directly. always() lets this run even though release-please is
    # skipped on the release event.
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'release')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      major: ${{ steps.v.outputs.major }}
    steps:
      - id: v
        shell: bash
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Prefer the published-release tag; fall back to release-please's.
          tag="${REL_TAG:-$RP_TAG}"
          if [ -z "$tag" ]; then echo "::error::could not resolve a release tag"; exit 1; fi
          major="${tag#v}"; major="${major%%.*}"
          if [ -z "$major" ]; then echo "::error::could not parse a major version from '$tag'"; exit 1; fi
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

  move-major-alias:
    name: Move v<major> alias
    needs: [version]
    # !cancelled() is required: `version` transitively depends on the
    # release-please job, which is SKIPPED on the release event. Without
    # !cancelled(), GitHub propagates that skip and skips this job too, even
    # though `version` itself succeeded. !cancelled() forces the if to evaluate;
    # the result check then gates on version actually having succeeded.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move alias
        env:
          TAG: ${{ needs.version.outputs.tag }}
          MAJOR: ${{ needs.version.outputs.major }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${MAJOR}" "${TAG}"
          git push origin "v${MAJOR}" --force || {
            echo "::error::Failed to move v${MAJOR} alias to ${TAG} — the floating major tag is now stale"
            exit 1
          }

  mirror:
    name: Mirror ${{ matrix.action }} to publish repo
    needs: [version]
    # !cancelled() forces the if to evaluate even though `version`'s ancestor
    # release-please is SKIPPED on the release event; the result check then gates
    # on `version` actually having succeeded.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    # Job-level env can read `secrets`; a step `if:` cannot. This lets the job
    # skip cleanly until a push credential (GitHub App install or PAT) + the
    # mirror repos exist, instead of failing every release red during setup.
    env:
      HAS_APP: ${{ secrets.APP_ID != '' }}
      HAS_PUSH_TOKEN: ${{ secrets.RELEASE_TOOLU_ACTIONS_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - action: code-review
            mirror_repo: Falconiere/toolu-code-review
            mirror_name: toolu-code-review
          - action: cloudflare-tunnel
            mirror_repo: Falconiere/toolu-cloudflare-tunnel
            mirror_name: toolu-cloudflare-tunnel
          - action: expo-builder
            mirror_repo: Falconiere/toolu-expo-builder
            mirror_name: toolu-expo-builder
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Cross-repo token: the app must be INSTALLED on the mirror repo for this
      # mint to succeed (`repositories:` takes bare names under `owner`).
      # continue-on-error → fall back to the PAT, then to a clean skip.
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: env.HAS_APP == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.mirror_name }}
      # Surface a masked mint failure loudly — continue-on-error keeps the run
      # alive, but a missing app install on the mirror must not hide behind the
      # PAT fallback / skip.
      - name: App token mint failed (falling back)
        if: steps.app-token.outcome == 'failure'
        run: echo "::warning::create-github-app-token failed for ${{ matrix.mirror_repo }} — check the app installation/permissions there; mirror falls back to the PAT or skips."
      - name: Skip notice (no push credential)
        if: steps.app-token.outputs.token == '' && env.HAS_PUSH_TOKEN != 'true'
        run: echo "::notice::No GitHub App install or RELEASE_TOOLU_ACTIONS_TOKEN for ${{ matrix.mirror_repo }} — skipping ${{ matrix.action }} mirror. Install the app on the mirror repo (or set the PAT) to enable Marketplace publishing."
      - name: Sync ${{ matrix.action }} to ${{ matrix.mirror_repo }}
        if: steps.app-token.outputs.token != '' || env.HAS_PUSH_TOKEN == 'true'
        run: scripts/mirror-action.sh "$RUNNER_TEMP/mirror"
        env:
          ACTION: ${{ matrix.action }}
          TAG: ${{ needs.version.outputs.tag }}
          MAJOR: ${{ needs.version.outputs.major }}
          MIRROR_REPO: ${{ matrix.mirror_repo }}
          MIRROR_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOOLU_ACTIONS_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
